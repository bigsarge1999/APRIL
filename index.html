<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root{--g9:#08100b;--g8:#17402a;--g6:#2fbf6b;--g2:#1a2b21;--g1:#17261d;--bg:#0b130e;--ink:#e3efe6;--mut:#8aa093;--line:#25382b;--red:#e5605a;--amb:#e0a93a;--card:#121d16;--in:#0e1812}
:root[data-theme=amber]{--g8:#47360f;--g6:#e0a93a;--g2:#2b2312;--g1:#271f12;--bg:#130f08;--card:#1d1710;--line:#3a2f1c;--in:#18130b}
:root[data-theme=red]{--g8:#4a1a17;--g6:#e5605a;--g2:#2b1614;--g1:#27140f;--bg:#130a09;--card:#1d100e;--line:#3a1f1c;--in:#180d0b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
header{background:var(--g9);color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:4px solid var(--g6);flex-wrap:wrap}
header h1{font-size:20px;margin:14px 0;font-weight:700;letter-spacing:.3px}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:none;border:0;color:#cfe3d5;padding:18px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-4px}
nav button.on{color:#fff;border-bottom-color:#fff;background:var(--g8)}
nav button:hover{color:#fff}
main{max-width:1200px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--g6);padding:14px 16px}
.stat b{display:block;font-size:28px;color:var(--g6)}
.stat span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);margin-bottom:22px}
.panel>h2{margin:0;padding:12px 16px;font-size:16px;background:var(--g8);color:#fff}
.pad{padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--g2);color:var(--ink);position:sticky;top:0}
td:first-child,th:first-child{text-align:left;font-weight:700}
#sp td:nth-child(2),#sp th:nth-child(2){text-align:left}
tr:hover td{background:var(--g1)}
.grp{background:var(--g8)!important;color:#fff!important;text-align:center!important}
.P{color:var(--g6);font-weight:700}.A{color:var(--red);font-weight:700}.T{color:var(--amb);font-weight:700}
.low{color:var(--red);font-weight:700}.hi{color:var(--g6);font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],select,textarea{border:1px solid var(--line);padding:8px 10px;background:var(--in);color:var(--ink);border-radius:2px}
textarea{width:100%;min-height:110px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8fc4a0;outline-offset:1px}
.btn{background:var(--g6);color:#06140c;font-weight:700;border:0;padding:9px 16px;cursor:pointer;border-radius:2px}
.btn:hover{filter:brightness(1.12)}
.btn.alt{background:transparent;color:var(--g6);border:1px solid var(--g6)}
.btn.del{background:var(--red);color:#fff}
.sub{display:flex;gap:0;border-bottom:2px solid var(--g6);margin-bottom:18px}
.sub button{background:var(--g1);border:1px solid var(--line);border-bottom:0;padding:10px 20px;cursor:pointer;color:var(--g6)}
.sub button.on{background:var(--g6);color:#06140c;font-weight:700}
.gi{width:56px;text-align:center;padding:5px}
.ab{width:34px;height:30px;border:1px solid var(--line);background:var(--in);cursor:pointer;font-weight:700}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700}
.b-ok{background:#12351f;color:#5fe39a}.b-bad{background:#3a1a17;color:#ff8a80}.b-mid{background:#3a2d0e;color:#f0c15a}

.printonly{display:none}
.warn{background:#3a1a17;color:#ffb4ac;border:1px solid var(--red);padding:10px 14px;margin-bottom:16px}
.pgrid{display:flex;gap:10px;flex-wrap:wrap}.pcell{display:flex;flex-direction:column;gap:4px;align-items:center}.pcell select{padding:5px;background:var(--in);color:var(--ink);border:1px solid var(--line)}
#theme{background:var(--g9);color:#cfe3d5;border:1px solid #6aa782;font-size:12px;padding:3px 6px}
#sync{font-size:12px;padding:3px 10px;border:1px solid #6aa782;border-radius:10px;color:#cfe3d5}
.empty{padding:34px;text-align:center;color:var(--mut)}
@media print{.printonly{display:block!important;margin-bottom:8px}.panel>h2{color:#000!important}.panel{border:0}:root,:root[data-theme]{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#bbb;--g2:#eee;--g1:#fff;--g6:#1a6b3a;--g8:#ddd;--in:#fff}.stat b,.P{color:#1a6b3a}header,.tools,.sub,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Dashboard</h1><span id="sync">Local mode</span><select id="theme" aria-label="Color theme"><option value="">Green</option><option value="amber">Amber</option><option value="red">Red</option></select>
  <nav><button data-t="dash" class="on">Dashboard</button><button data-t="admin">Admin</button></nav>
</header>
<main>
<div class="warn noprint" id="warn" hidden></div>
<section id="dash"></section>
<section id="admin" hidden></section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ===== SETUP: paste your Firebase web config here (Project settings > Your apps > Web) ===== */
const CFG={apiKey:"AIzaSyAgiVgV7UKgcm6t-XpMic_ktLWhVk_hV_Y",authDomain:"april-9a7df.firebaseapp.com",databaseURL:"https://april-9a7df-default-rtdb.firebaseio.com",projectId:"april-9a7df",appId:"1:602873738065:web:55653a291ca634d83f9970"};
const PERIODS=7; // change to match your school's schedule
/* Uses Firebase REALTIME DATABASE. Rules to use: {"rules":{".read":true,".write":"auth != null"}} */

const live=CFG.apiKey!=="YOUR_API_KEY";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pr=Array.from({length:PERIODS},(_,i)=>i+1);
let gMsg="",fs=null,sport="",imMsg="",fileName="",students=[],user=null,db,auth,tab="dash",sub="students",q="",rep=null;

/* ---------- data layer (Realtime Database live, or localStorage fallback) ---------- */
const eff=()=>fs===null?sport:fs;
const pool=()=>students.filter(s=>!eff()||(s.sport||"")===eff());
const sportList=()=>[...new Set([...students.map(s=>s.sport).filter(Boolean),...(sport?[sport]:[])])].sort();
const sportOpts=()=>'<option value="">All sports</option>'+sportList().map(x=>`<option ${x===eff()?"selected":""}>${esc(x)}</option>`).join("");
function blank(name){return{name,sport:sport||"",att:Array(PERIODS).fill("P"),grades:Array(PERIODS).fill("")}}
const toArr=x=>Array.isArray(x)?x:Object.values(x||{});
function norm(s){const a=Array(PERIODS).fill("P"),g=Array(PERIODS).fill("");toArr(s.att).forEach((v,i)=>{if(i<PERIODS)a[i]=v});toArr(s.grades).forEach((v,i)=>{if(i<PERIODS)g[i]=v});return{...s,att:a,grades:g}}
function localLoad(){try{students=JSON.parse(localStorage.getItem("students")||"[]").map(norm)}catch(e){students=[]}}
function localSave(){try{localStorage.setItem("students",JSON.stringify(students))}catch(e){}}
async function saveS(s){
  if(live){try{const{id,...d}=s,c=JSON.parse(JSON.stringify(d));if(id)await db.ref("students/"+id).set(c);else await db.ref("students").push(c)}catch(e){alert("Could not save online: "+e.message)}}
  else{if(!s.id){s.id="l"+Date.now()+Math.random().toString(36).slice(2,6);students.push(s)}localSave();render()}
}
async function delS(id){if(live){try{await db.ref("students/"+id).remove()}catch(e){alert("Could not delete online: "+e.message)}}else{students=students.filter(s=>s.id!==id);localSave();render()}}
function canEdit(){return !live||!!user}

/* ---------- math ---------- */
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
const avg=a=>{const n=a.map(num).filter(v=>v!==null);return n.length?n.reduce((x,y)=>x+y,0)/n.length:null};
const attPct=a=>{const c=a.length;return c?Math.round(a.filter(v=>v==="P"||v==="T").length/c*100):0};
const fmt=v=>v===null?"–":v.toFixed(1);
const gcls=v=>v===null?"":v<70?"low":v>=90?"hi":"";
const letter=v=>v===null?"–":v>=90?"A":v>=80?"B":v>=70?"C":v>=60?"D":"F";

/* ---------- dashboard ---------- */
function renderDash(){
  const P=pool(),n=P.length,all=P.flatMap(s=>s.att),pres=all.length?Math.round(all.filter(v=>v!=="A").length/all.length*100):0;
  const ga=avg(P.flatMap(s=>s.grades)),risk=P.filter(s=>{const g=avg(s.grades);return(g!==null&&g<70)||attPct(s.att)<85}).length;
  const list=[...P].sort((a,b)=>a.name.localeCompare(b.name));
  $("#dash").innerHTML=`
  <div class="panel" style="max-width:560px"><h2>Student lookup</h2><div class="pad"><div class="tools noprint" style="flex-wrap:nowrap;margin-bottom:0"><select id="fsel" aria-label="Sport">${sportOpts()}</select><input type="text" id="srch" list="sl" autocomplete="off" placeholder="Type a student's name" value="${esc(q)}" style="flex:1;min-width:0;font-size:16px"><button class="btn" id="prt">Print</button></div><div class="printonly"><b>Student report</b>${eff()?" &middot; "+esc(eff()):""} &middot; ${new Date().toLocaleDateString()}</div><datalist id="sl">${list.map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist><div id="res">${resHTML()}</div></div></div>
  <div class="stats"><div class="stat"><b>${n}</b><span>Students</span></div><div class="stat"><b>${n?pres+"%":"–"}</b><span>Attendance rate</span></div><div class="stat"><b>${fmt(ga)}</b><span>Average grade</span></div><div class="stat"><b>${risk}</b><span>Need attention</span></div></div>`;
  $("#fsel").onchange=e=>{fs=e.target.value;renderDash()};
  $("#srch").oninput=e=>{q=e.target.value;showRes()};
  $("#prt").onclick=()=>{if($("#res table"))print();else alert("Look up a student first, then print.")};
  showRes();
}
function showRes(){$("#res").innerHTML=resHTML();document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{q=b.dataset.pick;$("#srch").value=q;showRes()})}
function resHTML(){
  const t=q.trim().toLowerCase();
  if(!t)return'<p class="note">Start typing a name to see that student\'s attendance and grades.</p>';
  const m=pool().filter(s=>s.name.toLowerCase().includes(t)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!m.length)return'<p class="note">No student found.</p>';
  const ex=m.find(s=>s.name.toLowerCase()===t),s=ex||(m.length===1?m[0]:null);
  if(!s)return`<p class="note">${m.length} matches. Pick one:</p><div class="tools">${m.slice(0,12).map(x=>`<button class="btn alt" data-pick="${esc(x.name)}">${esc(x.name)}</button>`).join("")}</div>`;
  const g=avg(s.grades),a=attPct(s.att),ab=s.att.filter(v=>v==="A").length,ta=s.att.filter(v=>v==="T").length,bad=(g!==null&&g<70)||a<85;
  return`<h3 style="margin:14px 0 4px;font-size:22px">${esc(s.name)} <span class="badge ${bad?"b-bad":"b-ok"}">${bad?"Needs attention":"On track"}</span> ${s.sport?`<span class="badge b-mid">${esc(s.sport)}</span>`:""}</h3>
  <div class="stats" style="margin:12px 0"><div class="stat"><b>${a}%</b><span>Attendance</span></div><div class="stat"><b class="${gcls(g)}">${fmt(g)} ${letter(g)}</b><span>Average grade</span></div><div class="stat"><b>${ab} / ${ta}</b><span>Absent / tardy</span></div></div>
  <div class="scroll"><table><thead><tr><th>Period</th><th>Attendance</th><th>Grade</th></tr></thead><tbody>${pr.map((p,i)=>{const v=s.grades[i];return`<tr><td>Period ${p}</td><td class="${s.att[i]}">${{P:"Present",A:"Absent",T:"Tardy"}[s.att[i]]}</td><td class="${gcls(num(v))}">${v===""?"–":esc(v)}</td></tr>`}).join("")}</tbody></table></div>`;
}

/* ---------- admin ---------- */
function renderAdmin(){
  const el=$("#admin");
  if(live&&!user){el.innerHTML=`<div class="panel" style="max-width:380px;margin:30px auto"><h2>Admin sign in</h2><div class="pad"><p><input type="email" id="em" placeholder="Email" style="width:100%"></p><p><input type="password" id="pw" placeholder="Password" style="width:100%"></p><button class="btn" id="li">Sign in</button><p class="note" id="lm"></p></div></div>`;
    $("#li").onclick=()=>auth.signInWithEmailAndPassword($("#em").value,$("#pw").value).catch(e=>$("#lm").textContent="Sign in failed: "+e.message);return}
  el.innerHTML=`<div class="sub"><button data-s="students" class="${sub=="students"?"on":""}">Students</button><button data-s="import" class="${sub=="import"?"on":""}">Import</button><button data-s="sport" class="${sub=="sport"?"on":""}">Sport</button><button data-s="reports" class="${sub=="reports"?"on":""}">Reports</button>${live?`<button id="lo" style="margin-left:auto">Sign out</button>`:""}</div><div id="sp"></div>`;
  el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;renderAdmin()});
  if($("#lo"))$("#lo").onclick=()=>auth.signOut();
  ({students:adminStudents,import:adminImport,sport:adminSport,reports:adminReports})[sub]();
}
function adminStudents(){
  $("#sp").innerHTML=`<div class="panel"><h2>Add grade</h2><div class="pad"><div class="tools" style="margin-bottom:0"><input type="text" id="gn" list="gl" autocomplete="off" placeholder="Student name" style="flex:1;min-width:200px"><datalist id="gl">${[...students].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${esc(x.name)}">`).join("")}</datalist><select id="gp" aria-label="Period">${pr.map(p=>`<option value="${p-1}">Period ${p}</option>`).join("")}</select><input type="number" min="0" max="100" id="gv" placeholder="Grade" style="width:90px"><select id="ga" aria-label="Attendance"><option value="">Attendance: no change</option><option value="P">Present</option><option value="A">Absent</option><option value="T">Tardy</option></select><button class="btn" id="gb">Add grade</button></div><p class="note" id="gm">${esc(gMsg)}</p></div></div>
  <div class="panel"><h2>Manage students</h2><div class="pad"><div class="tools" style="margin-bottom:8px"><input type="text" id="nn" placeholder="Student name" style="flex:1;min-width:200px"><input type="text" id="ns" list="spl3" autocomplete="off" placeholder="Sport" value="${esc(sport)}" style="width:150px"><datalist id="spl3">${[...new Set([...SPORTS,...sportList()])].map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
  <div class="pgrid">${pr.map((p,i)=>`<div class="pcell"><b>P${p}</b><select data-na="${i}"><option>P</option><option>A</option><option>T</option></select><input type="number" min="0" max="100" class="gi" data-ng="${i}" placeholder="Grade"></div>`).join("")}</div>
  <div class="tools" style="margin-top:10px"><button class="btn" id="add">Add student</button><span class="note">Set attendance (P present, A absent, T tardy) and a grade for each period, then add.</span></div>
  <div class="tools"><select id="dsel"><option value="">All students (${students.length})</option>${sportList().map(x=>`<option value="${esc(x)}">${esc(x)} (${students.filter(s=>(s.sport||"")===x).length})</option>`).join("")}</select><button class="btn del" id="dall">Delete complete list</button></div>
  ${students.length?`<div class="scroll"><table><thead><tr><th></th><th>Name</th><th>Sport</th>${pr.map(p=>`<th>Att P${p}</th>`).join("")}${pr.map(p=>`<th>Gr P${p}</th>`).join("")}</tr></thead><tbody>
  ${[...students].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr data-id="${s.id}"><td><button class="btn del" data-d="1" style="padding:4px 10px">Delete</button></td><td>${esc(s.name)}</td><td><input type="text" class="gi" style="width:110px" data-ss value="${esc(s.sport||"")}"></td>${s.att.map((v,i)=>`<td><button class="ab ${v}" data-a="${i}">${v}</button></td>`).join("")}${s.grades.map((v,i)=>`<td><input type="number" min="0" max="100" class="gi" data-g="${i}" value="${esc(v)}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="note">Click an attendance box to cycle P, A, T. Grades save when you leave the box.</p>`:`<div class="empty">Add your first student above.</div>`}</div></div>`;
  $("#gb").onclick=async()=>{
    const nm=$("#gn").value.trim().toLowerCase(),st=students.find(x=>x.name.toLowerCase()===nm),gv=$("#gv").value.trim();
    if(!st){$("#gm").textContent="Pick a student from the list.";return}
    if(gv===""&&!$("#ga").value){$("#gm").textContent="Enter a grade or choose attendance.";return}
    if(gv!==""&&(isNaN(+gv)||+gv<0||+gv>100)){$("#gm").textContent="Grade must be 0 to 100.";return}
    const i=+$("#gp").value;if(gv!=="")st.grades[i]=gv;if($("#ga").value)st.att[i]=$("#ga").value;
    gMsg="Saved "+st.name+", period "+(i+1)+(gv!==""?": grade "+gv:"")+($("#ga").value?", "+({P:"present",A:"absent",T:"tardy"}[$("#ga").value]):"")+".";
    await saveS(st);adminStudents()};
  $("#add").onclick=async()=>{
    const v=$("#nn").value.trim();if(!v){$("#nn").focus();return}
    const st=blank(v);st.sport=$("#ns").value.trim();
    document.querySelectorAll("[data-na]").forEach(x=>st.att[+x.dataset.na]=x.value);
    document.querySelectorAll("[data-ng]").forEach(x=>st.grades[+x.dataset.ng]=x.value.trim());
    await saveS(st);adminStudents()};
  $("#nn").onkeydown=e=>{if(e.key==="Enter")$("#add").click()};
  $("#dall").onclick=async()=>{
    const v=$("#dsel").value,L=v?students.filter(s=>(s.sport||"")===v):[...students];
    if(!L.length){alert("There is nothing to delete.");return}
    if(v){if(!confirm("Delete all "+L.length+" students in "+v+"? This cannot be undone."))return}
    else if((prompt("This deletes ALL "+L.length+" students and cannot be undone. Type DELETE to confirm.")||"").trim()!=="DELETE")return;
    for(const x of L)await delS(x.id);
    adminStudents()};
  document.querySelectorAll("#sp tr[data-id]").forEach(tr=>{
    const s=students.find(x=>x.id===tr.dataset.id);
    tr.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const i=+b.dataset.a;s.att[i]={P:"A",A:"T",T:"P"}[s.att[i]];saveS(s).then(()=>{if(!live)adminStudents()})});
    tr.querySelectorAll("[data-g]").forEach(inp=>inp.onchange=()=>{s.grades[+inp.dataset.g]=inp.value;saveS(s)});
    tr.querySelector("[data-ss]").onchange=e=>{s.sport=e.target.value.trim();saveS(s)};
    tr.querySelector("[data-d]").onclick=()=>{if(confirm("Delete "+s.name+"?"))delS(s.id)};
  });
}
const SPORTS=["Basketball - Freshman","Basketball - JV","Basketball - Varsity","Baseball","Cross Country","Football","Golf","Lacrosse","Soccer","Softball","Swimming","Tennis","Track and Field","Volleyball","Wrestling"];
function updHead(){$("#ttl").textContent="Dashboard"+(sport?" \u00b7 "+sport:"");const p=$(".printonly");if(p)p.innerHTML="<b>Student report</b>"+(eff()?" &middot; "+esc(eff()):"")+" &middot; "+new Date().toLocaleDateString()}
async function saveSport(v){
  v=v.trim();
  if(live){try{await db.ref("settings/sport").set(v)}catch(e){alert("Could not save online: "+e.message)}}
  else{try{localStorage.setItem("sport",v)}catch(e){}}
  sport=v;updHead();
}
function adminSport(){
  $("#sp").innerHTML=`<div class="panel"><h2>Sport</h2><div class="pad"><p>Pick a sport from the list or type your own.</p>
  <div class="tools"><input type="text" id="spt" list="spl" autocomplete="off" placeholder="Type or pick a sport" value="${esc(sport)}" style="flex:1;min-width:220px"><datalist id="spl">${SPORTS.map(x=>`<option value="${x}">`).join("")}</datalist><button class="btn" id="sps">Save</button><button class="btn alt" id="spc">Clear</button></div>
  <div class="tools">${SPORTS.map(x=>`<button class="btn alt" data-sp="${x}">${x}</button>`).join("")}</div>
  <p class="note" id="spm">${sport?"Current sport: "+esc(sport):"No sport set."}</p></div></div>`;
  document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{$("#spt").value=b.dataset.sp});
  $("#sps").onclick=async()=>{await saveSport($("#spt").value);$("#spm").textContent=sport?"Saved. Current sport: "+sport:"Cleared."};
  $("#spc").onclick=async()=>{$("#spt").value="";await saveSport("");$("#spm").textContent="Cleared."};
}
function adminImport(){
  $("#sp").innerHTML=`<div class="panel"><h2>Import from Google Docs or Sheets</h2><div class="pad">
  <p><b>Option 1: Paste.</b> In Google Sheets (or a table in a Google Doc), select the table, copy it, and paste below. Columns: Name, then Attendance P1–P${PERIODS} (P, A or T), then Grades P1–P${PERIODS}. A header row is fine.</p>
  <textarea id="paste" placeholder="Paste copied table here"></textarea>
  <p><b>Option 2: Sheet link.</b> In Google Sheets choose File, Share, Publish to web, pick CSV, and paste the link.</p>
  <div class="tools"><input type="url" id="url" placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv" style="flex:1;min-width:240px"></div>
  <p><b>Option 3: File.</b> <input type="file" id="file" accept=".csv,.tsv,.txt"></p>
  <p><b>Sport for this import:</b> <input type="text" id="isp" list="spl2" autocomplete="off" placeholder="Type or pick a sport" value="${esc(sport)}"><datalist id="spl2">${SPORTS.map(x=>`<option value="${x}">`).join("")}</datalist></p><p class="note">Optional. If your file has a Sport column after the grades, each row uses its own sport instead.</p>
  <div class="tools"><label><input type="checkbox" id="rep"> Replace all existing students</label><button class="btn" id="go">Import</button><button class="btn alt" id="tpl">Download template</button></div><p class="note" id="im">${esc(imMsg)}</p></div></div>
  <div class="panel"><h2>Imported files</h2><div class="pad">${hist()}</div></div>`;
  $("#paste").oninput=()=>{fileName=""};
  $("#file").onchange=e=>{const f=e.target.files[0];if(f){fileName=f.name;f.text().then(t=>$("#paste").value=t)}};
  document.querySelectorAll("[data-di]").forEach(b=>b.onclick=async()=>{
    const ids=students.filter(s=>s.imp&&s.imp.id===b.dataset.di);
    if(!confirm("Delete the "+ids.length+" students from this import?"))return;
    for(const s of ids)await delS(s.id);imMsg="Deleted import ("+ids.length+" students).";adminImport()});
  if($("#delall"))$("#delall").onclick=async()=>{
    if(!confirm("Delete ALL "+students.length+" students? This cannot be undone."))return;
    for(const s of[...students])await delS(s.id);imMsg="All students deleted.";adminImport()};
  $("#tpl").onclick=()=>dl("template.csv",["Name",...pr.map(p=>"Att P"+p),...pr.map(p=>"Grade P"+p),"Sport"].join(",")+"\nJane Doe,"+pr.map((p,i)=>i==2?"T":"P").join(",")+","+pr.map(()=>90).join(",")+",Golf");
  $("#go").onclick=async()=>{
    let t=$("#paste").value,u=$("#url").value.trim(),m=$("#im");
    try{if(u){m.textContent="Fetching...";t=await(await fetch(u)).text()}
      const rows=parse(t);if(!rows.length)throw Error("Nothing to import.");
      const isp=$("#isp").value.trim();
      const out=rows.map(r=>({sport:((r[1+2*PERIODS]||"").trim()||isp),name:(r[0]||"").trim(),att:r.slice(1,1+PERIODS).map(v=>{v=(v||"P").trim().toUpperCase()[0];return"PAT".includes(v)?v:"P"}),grades:r.slice(1+PERIODS,1+2*PERIODS).map(v=>num((v||"").trim())===null?"":(v||"").trim())})).filter(s=>s.name).map(norm);
      if(!out.length)throw Error("No student names found.");
      const imp={id:"i"+Date.now(),at:Date.now(),label:u?"Sheet link":(fileName||"Pasted data")};out.forEach(s=>s.imp=imp);
      if($("#rep").checked)for(const s of[...students])await delS(s.id);
      for(const s of out)await saveS(s);
      imMsg="Imported "+out.length+" students.";fileName="";adminImport();
    }catch(e){m.textContent="Import failed: "+e.message+(u?" (check the link is published as CSV)":"")}
  };
}
function hist(){
  const g={};students.forEach(s=>{const k=s.imp?s.imp.id:"manual";const e=(g[k]=g[k]||{imp:s.imp,n:0,sp:new Set()});e.n++;if(s.sport)e.sp.add(s.sport)});
  const keys=Object.keys(g).sort((a,b)=>(g[b].imp?g[b].imp.at:0)-(g[a].imp?g[a].imp.at:0));
  if(!keys.length)return'<div class="empty">No students or imports yet.</div>';
  return`<table><thead><tr><th>Source</th><th>Sport</th><th>Imported</th><th>Students</th><th></th></tr></thead><tbody>${keys.map(k=>{const i=g[k].imp;
  return`<tr><td>${i?esc(i.label):"Added manually"}</td><td>${esc([...g[k].sp].join(", ")||"–")}</td><td>${i?new Date(i.at).toLocaleString():"–"}</td><td>${g[k].n}</td><td>${i?`<button class="btn del" data-di="${esc(k)}">Delete import</button>`:""}</td></tr>`}).join("")}</tbody></table>
  <p class="tools" style="margin-top:14px"><button class="btn del" id="delall">Delete all students</button></p>`}
function parse(t){
  const d=t.includes("\t")?"\t":",",rows=[];let r=[],c="",inq=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}
    else if(ch=='"')inq=true;else if(ch===d){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.filter(r=>r.some(x=>x.trim())&&!/^(student|name)/i.test((r[0]||"").trim()));
}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;a.click()}

/* ---------- reports ---------- */
function adminReports(){
  const types={period:"Period summary",student:"Student report",attention:"Needs attention"};
  rep=rep||"period";
  let head,body,csv=[];
  const sorted=[...pool()].sort((a,b)=>a.name.localeCompare(b.name));
  if(rep==="period"){
    head=["Period","Attendance rate","Absences","Tardies","Average grade","Below 70"];
    body=pr.map((p,i)=>{const at=pool().map(s=>s.att[i]),gr=pool().map(s=>num(s.grades[i])).filter(v=>v!==null);
      return[`P${p}`,pool().length?Math.round(at.filter(v=>v!=="A").length/at.length*100)+"%":"–",at.filter(v=>v==="A").length,at.filter(v=>v==="T").length,fmt(avg(gr)),gr.filter(v=>v<70).length]});
  }else{
    head=["Student","Attendance %","Absences","Tardies","Average","Grade","Status"];
    body=sorted.map(s=>{const g=avg(s.grades),a=attPct(s.att),bad=(g!==null&&g<70)||a<85;
      return[s.name,a+"%",s.att.filter(v=>v==="A").length,s.att.filter(v=>v==="T").length,fmt(g),letter(g),bad?"Needs attention":(g!==null&&g>=90&&a>=95?"Excellent":"On track")]});
    if(rep==="attention")body=body.filter(r=>r[6]==="Needs attention");
  }
  $("#sp").innerHTML=`<div class="panel"><h2>Reports</h2><div class="pad"><div class="tools noprint"><select id="rsp" aria-label="Sport">${sportOpts()}</select><select id="rt">${Object.entries(types).map(([k,v])=>`<option value="${k}" ${k===rep?"selected":""}>${v}</option>`).join("")}</select><button class="btn alt" id="pr">Print</button><button class="btn" id="ex">Export CSV</button></div>
  ${body.length?`<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map((c,i)=>i===6?`<td><span class="badge ${c==="Needs attention"?"b-bad":c==="Excellent"?"b-ok":"b-mid"}">${c}</span></td>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nothing to report yet.</div>`}
  <p class="note">Needs attention means an average under 70 or attendance under 85%.</p></div></div>`;
  $("#rsp").onchange=e=>{fs=e.target.value;adminReports()};
  $("#rt").onchange=e=>{rep=e.target.value;adminReports()};
  $("#pr").onclick=()=>print();
  $("#ex").onclick=()=>dl("report.csv",[head,...body].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n"));
}

/* ---------- shell ---------- */
function render(){tab==="dash"?renderDash():renderAdmin()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  $("#dash").hidden=tab!=="dash";$("#admin").hidden=tab!=="admin";render()});
if(live){
  firebase.initializeApp(CFG);db=firebase.database();auth=firebase.auth();
  $("#sync").textContent="Live";
  db.ref("students").on("value",snap=>{const v=snap.val()||{};students=Object.entries(v).map(([id,d])=>norm({id,...d}));
    const a=document.activeElement;if(tab==="admin"&&a&&a.tagName==="INPUT"&&a.id!=="srch")return;render()},e=>{$("#sync").textContent="Sync error";$("#warn").hidden=false;$("#warn").textContent="Cannot read the database: "+e.message});
  auth.onAuthStateChanged(u=>{user=u;if(tab==="admin")renderAdmin()});
  db.ref("settings/sport").on("value",d=>{sport=d.val()||"";updHead()});
}else{$("#warn").hidden=false;$("#warn").textContent="Local mode: Firebase is not connected, so students are saved only in this browser and will not appear on other devices. Add your Firebase settings in the CFG block to share data.";localLoad();try{sport=localStorage.getItem("sport")||""}catch(e){}updHead();$("#sync").title="Add your Firebase config at the top of the script to go live"}
const th=$("#theme");try{th.value=localStorage.getItem("theme")||"";document.documentElement.dataset.theme=th.value}catch(e){}
th.onchange=()=>{document.documentElement.dataset.theme=th.value;try{localStorage.setItem("theme",th.value)}catch(e){}};
render();
</script>
