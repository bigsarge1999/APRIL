<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root{--g9:#0f3d24;--g8:#165a35;--g6:#2e7d4f;--g2:#dcebe0;--g1:#eef5ef;--bg:#f4f7f4;--ink:#17261c;--mut:#5d6f63;--line:#cfdcd2;--red:#b3392f;--amb:#b9831a;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
header{background:var(--g9);color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:4px solid var(--g6);flex-wrap:wrap}
header h1{font-size:20px;margin:14px 0;font-weight:700;letter-spacing:.3px}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:none;border:0;color:#cfe3d5;padding:18px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-4px}
nav button.on{color:#fff;border-bottom-color:#fff;background:var(--g8)}
nav button:hover{color:#fff}
main{max-width:1200px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--g6);padding:14px 16px}
.stat b{display:block;font-size:28px;color:var(--g8)}
.stat span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);margin-bottom:22px}
.panel>h2{margin:0;padding:12px 16px;font-size:16px;background:var(--g8);color:#fff}
.pad{padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--g2);color:var(--g9);position:sticky;top:0}
td:first-child,th:first-child{text-align:left;font-weight:700}
tr:hover td{background:var(--g1)}
.grp{background:var(--g9)!important;color:#fff!important;text-align:center!important}
.P{color:var(--g6);font-weight:700}.A{color:var(--red);font-weight:700}.T{color:var(--amb);font-weight:700}
.low{color:var(--red);font-weight:700}.hi{color:var(--g6);font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],select,textarea{border:1px solid var(--line);padding:8px 10px;background:#fff;border-radius:2px}
textarea{width:100%;min-height:110px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8fc4a0;outline-offset:1px}
.btn{background:var(--g6);color:#fff;border:0;padding:9px 16px;cursor:pointer;border-radius:2px}
.btn:hover{background:var(--g8)}
.btn.alt{background:#fff;color:var(--g8);border:1px solid var(--g6)}
.btn.del{background:var(--red)}
.sub{display:flex;gap:0;border-bottom:2px solid var(--g6);margin-bottom:18px}
.sub button{background:var(--g1);border:1px solid var(--line);border-bottom:0;padding:10px 20px;cursor:pointer;color:var(--g8)}
.sub button.on{background:var(--g6);color:#fff}
.gi{width:56px;text-align:center;padding:5px}
.ab{width:34px;height:30px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700}
.b-ok{background:var(--g2);color:var(--g8)}.b-bad{background:#f6dcd9;color:var(--red)}.b-mid{background:#f5e8c8;color:#7a5610}
#sync{font-size:12px;padding:3px 10px;border:1px solid #6aa782;border-radius:10px;color:#cfe3d5}
.empty{padding:34px;text-align:center;color:var(--mut)}
@media print{header,.tools,.sub,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header>
  <h1>Dashboard</h1><span id="sync">Local mode</span>
  <nav><button data-t="dash" class="on">Dashboard</button><button data-t="admin">Admin</button></nav>
</header>
<main>
<section id="dash"></section>
<section id="admin" hidden></section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ===== SETUP: paste your Firebase web config here (Project settings > Your apps > Web) ===== */
const CFG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};
const PERIODS=7; // change to match your school's schedule
/* Firestore rules to use: allow read: if true; allow write: if request.auth != null; */

const live=CFG.apiKey!=="YOUR_API_KEY";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pr=Array.from({length:PERIODS},(_,i)=>i+1);
let students=[],user=null,db,auth,tab="dash",sub="students",q="",rep=null;

/* ---------- data layer (Firestore live, or localStorage fallback) ---------- */
function blank(name){return{name,att:Array(PERIODS).fill("P"),grades:Array(PERIODS).fill("")}}
function norm(s){const a=Array(PERIODS).fill("P"),g=Array(PERIODS).fill("");(s.att||[]).forEach((v,i)=>{if(i<PERIODS)a[i]=v});(s.grades||[]).forEach((v,i)=>{if(i<PERIODS)g[i]=v});return{...s,att:a,grades:g}}
function localLoad(){try{students=JSON.parse(localStorage.getItem("students")||"[]").map(norm)}catch(e){students=[]}}
function localSave(){try{localStorage.setItem("students",JSON.stringify(students))}catch(e){}}
async function saveS(s){
  if(live){const{id,...d}=s;if(id)await db.collection("students").doc(id).set(d);else await db.collection("students").add(d)}
  else{if(!s.id){s.id="l"+Date.now()+Math.random().toString(36).slice(2,6);students.push(s)}localSave();render()}
}
async function delS(id){if(live)await db.collection("students").doc(id).delete();else{students=students.filter(s=>s.id!==id);localSave();render()}}
function canEdit(){return !live||!!user}

/* ---------- math ---------- */
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
const avg=a=>{const n=a.map(num).filter(v=>v!==null);return n.length?n.reduce((x,y)=>x+y,0)/n.length:null};
const attPct=a=>{const c=a.length;return c?Math.round(a.filter(v=>v==="P"||v==="T").length/c*100):0};
const fmt=v=>v===null?"–":v.toFixed(1);
const gcls=v=>v===null?"":v<70?"low":v>=90?"hi":"";
const letter=v=>v===null?"–":v>=90?"A":v>=80?"B":v>=70?"C":v>=60?"D":"F";

/* ---------- dashboard ---------- */
function renderDash(){
  const n=students.length,all=students.flatMap(s=>s.att),pres=all.length?Math.round(all.filter(v=>v!=="A").length/all.length*100):0;
  const ga=avg(students.flatMap(s=>s.grades)),risk=students.filter(s=>{const g=avg(s.grades);return(g!==null&&g<70)||attPct(s.att)<85}).length;
  const list=students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
  $("#dash").innerHTML=`
  <div class="stats"><div class="stat"><b>${n}</b><span>Students</span></div><div class="stat"><b>${n?pres+"%":"–"}</b><span>Attendance rate</span></div><div class="stat"><b>${fmt(ga)}</b><span>Average grade</span></div><div class="stat"><b>${risk}</b><span>Need attention</span></div></div>
  <div class="panel"><h2>Students</h2><div class="pad"><div class="tools"><input type="text" id="srch" placeholder="Search by name" value="${esc(q)}"></div>
  ${n?`<div class="scroll"><table><thead><tr><th rowspan="2">Student name</th><th colspan="${PERIODS}" class="grp">Attendance by period</th><th colspan="${PERIODS}" class="grp">Grades by period</th><th rowspan="2">Avg</th></tr>
  <tr>${pr.map(p=>`<th>P${p}</th>`).join("")}${pr.map(p=>`<th>P${p}</th>`).join("")}</tr></thead><tbody>
  ${list.map(s=>{const g=avg(s.grades);return`<tr><td>${esc(s.name)}</td>${s.att.map(v=>`<td class="${v}">${v}</td>`).join("")}${s.grades.map(v=>`<td class="${gcls(num(v))}">${v===""?"–":esc(v)}</td>`).join("")}<td class="${gcls(g)}">${fmt(g)} ${letter(g)}</td></tr>`}).join("")}
  </tbody></table></div><p class="note">P present, A absent, T tardy. Grades under 70 show red.</p>`:`<div class="empty">No students yet. Open Admin to add students or import a Google Sheet.</div>`}
  </div></div>`;
  const i=$("#srch");if(i)i.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;renderDash();const x=$("#srch");x.focus();x.setSelectionRange(p,p)};
}

/* ---------- admin ---------- */
function renderAdmin(){
  const el=$("#admin");
  if(live&&!user){el.innerHTML=`<div class="panel" style="max-width:380px;margin:30px auto"><h2>Admin sign in</h2><div class="pad"><p><input type="email" id="em" placeholder="Email" style="width:100%"></p><p><input type="password" id="pw" placeholder="Password" style="width:100%"></p><button class="btn" id="li">Sign in</button><p class="note" id="lm"></p></div></div>`;
    $("#li").onclick=()=>auth.signInWithEmailAndPassword($("#em").value,$("#pw").value).catch(e=>$("#lm").textContent="Sign in failed: "+e.message);return}
  el.innerHTML=`<div class="sub"><button data-s="students" class="${sub=="students"?"on":""}">Students</button><button data-s="import" class="${sub=="import"?"on":""}">Import</button><button data-s="reports" class="${sub=="reports"?"on":""}">Reports</button>${live?`<button id="lo" style="margin-left:auto">Sign out</button>`:""}</div><div id="sp"></div>`;
  el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;renderAdmin()});
  if($("#lo"))$("#lo").onclick=()=>auth.signOut();
  ({students:adminStudents,import:adminImport,reports:adminReports})[sub]();
}
function adminStudents(){
  $("#sp").innerHTML=`<div class="panel"><h2>Manage students</h2><div class="pad"><div class="tools"><input type="text" id="nn" placeholder="New student name"><button class="btn" id="add">Add student</button></div>
  ${students.length?`<div class="scroll"><table><thead><tr><th>Name</th>${pr.map(p=>`<th>Att P${p}</th>`).join("")}${pr.map(p=>`<th>Gr P${p}</th>`).join("")}<th></th></tr></thead><tbody>
  ${[...students].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr data-id="${s.id}"><td>${esc(s.name)}</td>${s.att.map((v,i)=>`<td><button class="ab ${v}" data-a="${i}">${v}</button></td>`).join("")}${s.grades.map((v,i)=>`<td><input type="number" min="0" max="100" class="gi" data-g="${i}" value="${esc(v)}"></td>`).join("")}<td><button class="btn del" data-d="1">Delete</button></td></tr>`).join("")}</tbody></table></div><p class="note">Click an attendance box to cycle P, A, T. Grades save when you leave the box.</p>`:`<div class="empty">Add your first student above.</div>`}</div></div>`;
  $("#add").onclick=()=>{const v=$("#nn").value.trim();if(v)saveS(blank(v))};
  $("#nn").onkeydown=e=>{if(e.key==="Enter")$("#add").click()};
  document.querySelectorAll("#sp tr[data-id]").forEach(tr=>{
    const s=students.find(x=>x.id===tr.dataset.id);
    tr.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const i=+b.dataset.a;s.att[i]={P:"A",A:"T",T:"P"}[s.att[i]];saveS(s).then(()=>{if(!live)adminStudents()})});
    tr.querySelectorAll("[data-g]").forEach(inp=>inp.onchange=()=>{s.grades[+inp.dataset.g]=inp.value;saveS(s)});
    tr.querySelector("[data-d]").onclick=()=>{if(confirm("Delete "+s.name+"?"))delS(s.id)};
  });
}
function adminImport(){
  $("#sp").innerHTML=`<div class="panel"><h2>Import from Google Docs or Sheets</h2><div class="pad">
  <p><b>Option 1: Paste.</b> In Google Sheets (or a table in a Google Doc), select the table, copy it, and paste below. Columns: Name, then Attendance P1–P${PERIODS} (P, A or T), then Grades P1–P${PERIODS}. A header row is fine.</p>
  <textarea id="paste" placeholder="Paste copied table here"></textarea>
  <p><b>Option 2: Sheet link.</b> In Google Sheets choose File, Share, Publish to web, pick CSV, and paste the link.</p>
  <div class="tools"><input type="url" id="url" placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv" style="flex:1;min-width:240px"></div>
  <p><b>Option 3: File.</b> <input type="file" id="file" accept=".csv,.tsv,.txt"></p>
  <div class="tools"><label><input type="checkbox" id="rep"> Replace all existing students</label><button class="btn" id="go">Import</button><button class="btn alt" id="tpl">Download template</button></div><p class="note" id="im"></p></div></div>`;
  $("#file").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$("#paste").value=t)};
  $("#tpl").onclick=()=>dl("template.csv",["Name",...pr.map(p=>"Att P"+p),...pr.map(p=>"Grade P"+p)].join(",")+"\nJane Doe,"+pr.map((p,i)=>i==2?"T":"P").join(",")+","+pr.map(()=>90).join(","));
  $("#go").onclick=async()=>{
    let t=$("#paste").value,u=$("#url").value.trim(),m=$("#im");
    try{if(u){m.textContent="Fetching...";t=await(await fetch(u)).text()}
      const rows=parse(t);if(!rows.length)throw Error("Nothing to import.");
      const out=rows.map(r=>({name:(r[0]||"").trim(),att:r.slice(1,1+PERIODS).map(v=>{v=(v||"P").trim().toUpperCase()[0];return"PAT".includes(v)?v:"P"}),grades:r.slice(1+PERIODS,1+2*PERIODS).map(v=>num((v||"").trim())===null?"":(v||"").trim())})).filter(s=>s.name).map(norm);
      if(!out.length)throw Error("No student names found.");
      if($("#rep").checked)for(const s of[...students])await delS(s.id);
      for(const s of out)await saveS(s);
      m.textContent="Imported "+out.length+" students.";
    }catch(e){m.textContent="Import failed: "+e.message+(u?" (check the link is published as CSV)":"")}
  };
}
function parse(t){
  const d=t.includes("\t")?"\t":",",rows=[];let r=[],c="",inq=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}
    else if(ch=='"')inq=true;else if(ch===d){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.filter(r=>r.some(x=>x.trim())&&!/^(student|name)/i.test((r[0]||"").trim()));
}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;a.click()}

/* ---------- reports ---------- */
function adminReports(){
  const types={period:"Period summary",student:"Student report",attention:"Needs attention"};
  rep=rep||"period";
  let head,body,csv=[];
  const sorted=[...students].sort((a,b)=>a.name.localeCompare(b.name));
  if(rep==="period"){
    head=["Period","Attendance rate","Absences","Tardies","Average grade","Below 70"];
    body=pr.map((p,i)=>{const at=students.map(s=>s.att[i]),gr=students.map(s=>num(s.grades[i])).filter(v=>v!==null);
      return[`P${p}`,students.length?Math.round(at.filter(v=>v!=="A").length/at.length*100)+"%":"–",at.filter(v=>v==="A").length,at.filter(v=>v==="T").length,fmt(avg(gr)),gr.filter(v=>v<70).length]});
  }else{
    head=["Student","Attendance %","Absences","Tardies","Average","Grade","Status"];
    body=sorted.map(s=>{const g=avg(s.grades),a=attPct(s.att),bad=(g!==null&&g<70)||a<85;
      return[s.name,a+"%",s.att.filter(v=>v==="A").length,s.att.filter(v=>v==="T").length,fmt(g),letter(g),bad?"Needs attention":(g!==null&&g>=90&&a>=95?"Excellent":"On track")]});
    if(rep==="attention")body=body.filter(r=>r[6]==="Needs attention");
  }
  $("#sp").innerHTML=`<div class="panel"><h2>Reports</h2><div class="pad"><div class="tools noprint"><select id="rt">${Object.entries(types).map(([k,v])=>`<option value="${k}" ${k===rep?"selected":""}>${v}</option>`).join("")}</select><button class="btn alt" id="pr">Print</button><button class="btn" id="ex">Export CSV</button></div>
  ${body.length?`<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map((c,i)=>i===6?`<td><span class="badge ${c==="Needs attention"?"b-bad":c==="Excellent"?"b-ok":"b-mid"}">${c}</span></td>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nothing to report yet.</div>`}
  <p class="note">Needs attention means an average under 70 or attendance under 85%.</p></div></div>`;
  $("#rt").onchange=e=>{rep=e.target.value;adminReports()};
  $("#pr").onclick=()=>print();
  $("#ex").onclick=()=>dl("report.csv",[head,...body].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n"));
}

/* ---------- shell ---------- */
function render(){tab==="dash"?renderDash():renderAdmin()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  $("#dash").hidden=tab!=="dash";$("#admin").hidden=tab!=="admin";render()});
if(live){
  firebase.initializeApp(CFG);db=firebase.firestore();auth=firebase.auth();
  $("#sync").textContent="Live";
  db.collection("students").onSnapshot(snap=>{students=snap.docs.map(d=>norm({id:d.id,...d.data()}));
    const a=document.activeElement;if(tab==="admin"&&a&&a.tagName==="INPUT"&&a.id!=="srch")return;render()},e=>{$("#sync").textContent="Sync error"});
  auth.onAuthStateChanged(u=>{user=u;if(tab==="admin")renderAdmin()});
}else{localLoad();$("#sync").title="Add your Firebase config at the top of the script to go live"}
render();
</script>
</body>
</html>
